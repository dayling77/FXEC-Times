name: Add Comfiesta-26 Posters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  download-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google Drive downloader
        run: python -m pip install --upgrade gdown

      - name: Download poster images from Google Drive
        shell: bash
        run: |
          set -e
          mkdir -p mba/stories/comfiesta26/posters
          gdown --id "10JTdZJOp6392zEbNieW95TYI2PZHBusT" -O mba/stories/comfiesta26/posters/face-fiesta.webp
          gdown --id "1HQglOx6Dfq4e40jwpMypkO-go84-_E3D" -O mba/stories/comfiesta26/posters/snap-saga.webp
          gdown --id "1KSQxrZPpBcbgQDCNPpCokQKojKj8oBUb" -O mba/stories/comfiesta26/posters/dream-to-deal.webp
          gdown --id "1NxdQ1pOA0vhMcheCaHHB2CA8vuvrzpPi" -O mba/stories/comfiesta26/posters/sell-and-spell.webp
          gdown --id "1cCj3uh-JSSyZToZB-os0RYydQE_1TGdo" -O mba/stories/comfiesta26/posters/design-rush.webp
          gdown --id "1nhyR4RxcXxpN3wC2Sexup-3RhJrnugnJ" -O mba/stories/comfiesta26/posters/fashionomics.webp
          gdown --id "1rHTSQMCBkl1kakuN282vjMTZngNfeoy6" -O mba/stories/comfiesta26/posters/commerce-clash.webp
          gdown --id "1tn8oLwKwWf5WXbQ9lhjCjI_GS8EwD9K8" -O mba/stories/comfiesta26/posters/header-winners.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path("mba/stories/comfiesta26/posters").glob("*.webp"):
              with Image.open(p) as im:
                  print(p, im.size, im.format)
          PY

      - name: Commit poster images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mba/stories/comfiesta26/posters/*.webp
          if git diff --cached --quiet; then
            echo "No poster changes."
          else
            git commit -m "Add Comfiesta-26 poster gallery [skip ci]"
            git push
          fi
