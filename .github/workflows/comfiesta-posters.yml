name: Add Comfiesta-26 Posters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  download-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install download and image tools
        run: python -m pip install --upgrade gdown pillow

      - name: Download and convert poster images
        shell: bash
        run: |
          set -e
          mkdir -p mba/stories/comfiesta26/posters/raw
          gdown --id "10JTdZJOp6392zEbNieW95TYI2PZHBusT" -O mba/stories/comfiesta26/posters/raw/face-fiesta.jpg
          gdown --id "1HQglOx6Dfq4e40jwpMypkO-go84-_E3D" -O mba/stories/comfiesta26/posters/raw/snap-saga.jpg
          gdown --id "1KSQxrZPpBcbgQDCNPpCokQKojKj8oBUb" -O mba/stories/comfiesta26/posters/raw/dream-to-deal.jpg
          gdown --id "1NxdQ1pOA0vhMcheCaHHB2CA8vuvrzpPi" -O mba/stories/comfiesta26/posters/raw/sell-and-spell.jpg
          gdown --id "1cCj3uh-JSSyZToZB-os0RYydQE_1TGdo" -O mba/stories/comfiesta26/posters/raw/design-rush.jpg
          gdown --id "1nhyR4RxcXxpN3wC2Sexup-3RhJrnugnJ" -O mba/stories/comfiesta26/posters/raw/fashionomics.jpg
          gdown --id "1rHTSQMCBkl1kakuN282vjMTZngNfeoy6" -O mba/stories/comfiesta26/posters/raw/commerce-clash.jpg
          gdown --id "1tn8oLwKwWf5WXbQ9lhjCjI_GS8EwD9K8" -O mba/stories/comfiesta26/posters/raw/header-winners.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          raw=Path("mba/stories/comfiesta26/posters/raw")
          out=raw.parent
          for src in sorted(raw.glob("*.jpg")):
              with Image.open(src) as im:
                  im=im.convert("RGB")
                  im.thumbnail((1200,1500), Image.Resampling.LANCZOS)
                  dest=out/(src.stem+".webp")
                  im.save(dest,"WEBP",quality=78,method=6)
                  print(dest, im.size)
          PY
          rm -rf mba/stories/comfiesta26/posters/raw

      - name: Commit poster images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mba/stories/comfiesta26/posters/*.webp
          if git diff --cached --quiet; then
            echo "No poster changes."
          else
            git commit -m "Add Comfiesta-26 poster gallery [skip ci]"
            git push
          fi
